<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>SmartHomeControl</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">🏠</span><h1>SmartHomeControl</h1><span id="conn" class="conn">…</span></div>
  <nav class="nav">
    <button type="button" class="tab on" data-tab="home">Home</button>
    <button type="button" class="tab" data-tab="history">History</button>
  </nav>
</header>
<main class="main">
  <div id="note"></div>
  <section id="home">
    <div class="tools">
      <input id="search" type="search" placeholder="Search devices…">
      <select id="kind"><option value="">All kinds</option></select>
      <label class="check"><input type="checkbox" id="showAi"> Assistant access</label>
      <button type="button" id="reload" title="read rooms and devices from Home Assistant again">Reload</button>
    </div>
    <div id="rooms"><p class="muted">Loading…</p></div>
  </section>
  <section id="history" class="hidden"><div id="hist"></div></section>
</main>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>

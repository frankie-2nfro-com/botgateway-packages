type = "application"
id = "aimeetings"
name = "AI Meetings"
version = "0.1.0"
about = "Chair a meeting of AI models - Claude, GPT, Gemini, Grok, a model on your own computer, any LLM you add to 2nfro Desktop - and invited people. Set the purpose and the background, give each AI participant a role (e.g. finance, the critic, the user), then run it: an opening round where everyone answers at once without seeing the others, discussion rounds where they answer each other, a question to one of them, your instructions, closing statements. A secretary model drafts the minutes; you edit and finish them. People join on the application's website with an invitation code and a name, read along and write - only you start the AIs' turns, so only you decide what is spent. Meetings and minutes stay on your computer."
author = "2nfro"
license = "Apache-2.0"
timeout_secs = 60

[about_lang]
zh-Hant = "主持一個由多個 AI 模型參與的會議 - Claude、GPT、Gemini、Grok、你電腦上的模型，或你在 2nfro Desktop 加入的任何 LLM - 亦可邀請真人參加。寫下目的和背景，給每位 AI 與會者一個角色（例如財務、專挑毛病、用戶角度），然後開會：開場輪大家同時發言、互相看不到；討論輪互相回應；向其中一位提問；你的指示；總結發言。秘書模型起草會議紀要，由你修改定稿。真人在應用程式的網站用邀請碼和名字加入，可閱讀及發言 - 只有你可以叫 AI 發言，所以花費由你決定。會議及紀要都存在你的電腦。"

# Its own program (DOCUMENTATIONS/app_aimeetings_requirements.txt): server/main.js in the gateway's sandbox; its page is web/
# (the chair's page on this computer, the join page on the website). Needs gateway 1.1.33 or newer for several LLMs
# (llm_choice); on an older gateway every AI participant is answered by the application's one LLM.
[app]
main = "server/main.js"
icon = "web/icon.svg"
ai = "owner"
ai_sends = "each AI participant's turn goes to the LLM you chose for that participant, with the meeting's title, purpose and background, the participants' names and roles, and the transcript so far (also what invited people wrote); the minutes go to the LLM you choose for the secretary, with the transcript"
visitors = "join a meeting with its invitation code and a name, read the discussion and the finished minutes, write messages and raise a hand"
login = "own"
llm_choice = true

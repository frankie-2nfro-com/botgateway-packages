type = "application"
id = "recipes"
name = "Recipes"
version = "0.5.14"
about = "Your recipe book: collect screenshots, photos and notes as materials; the assistant writes the finished recipe from them - cover photo, ingredients you can scale, the method with step pictures. Its website shows the recipes you publish."
author = "Bot Gateway"
license = "Apache-2.0"
timeout_secs = 30

# The description in more languages (the Portal and the Applications page; else `about`, English).
[about_lang]
zh-Hant = "你的食譜書：把截圖、相片和筆記收集成素材，由助理寫成完整食譜 - 封面相、可按份量調整的材料、附步驟相片的做法。它的網站會展示你發佈的食譜。"

# Its own program (app_sandbox_requirements.txt): server/main.js runs in the gateway's sandbox, built on
# the app kit (kit/, copied from botgateway-packages/kit); its pages are web/.
[app]
main = "server/main.js"
icon = "web/icon.png"
ai = "owner"
ai_sends = "a recipe with its materials (photos, screenshots, notes) when you press Build recipe"
visitors = "read the published recipes and change the servings (amounts follow)"
login = "none"
# Triggers (app_triggers_requirements.txt): https://<its website>/hook/clip saves a recipe draft sent by another
# service (a shortcut on the phone, a script ...), signed with this secret. Empty = no triggers.
triggers = ["clip"]
settings = [{ key = "trigger_secret", label = "Trigger secret (for /hook/clip; empty = off)", type = "text", default = "" }]

# What the client's LLM may do (the program's callTool).
[[tools]]
name = "recipes_list"
title = "List recipes"
description = "The recipes (newest first), optionally only those containing a word, last changed in a year (e.g. \"2026\") and / or with a tag (e.g. \"湯\"); the answer also lists the years and the tags there are."
read_only = true
input_schema = { type = "object", properties = { query = { type = "string" }, year = { type = "string" }, tags = { type = "string", description = "only recipes with this tag" }, limit = { type = "integer" } } }
example = { query = "", year = "", tags = "", limit = 20 }

[[tools]]
name = "recipes_get"
title = "Read a recipe"
description = "One recipe with all its fields."
read_only = true
input_schema = { type = "object", required = ["id"], properties = { id = { type = "integer" } } }
example = { id = 1 }

[[tools]]
name = "recipes_add"
title = "Add a recipe"
description = "A new recipe (unpublished: only the owner sees it until they publish it): title (needed), status (unpublished / published), servings, ingredients [{qty, unit, name, note}], seasonings [same; salt, sauces, oil, spices], steps [{text}], tips [text], tags [text: cuisine and kind, e.g. 中菜, 湯], notes, source."
input_schema = { type = "object", required = ["title"], properties = { title = { type = "string" } } }
example = { title = "Test recipe from the Simulator", tags = ["test"] }

[[tools]]
name = "recipes_update"
title = "Change a recipe"
description = "Changes the given fields of recipe id (same fields as recipes_add)."
input_schema = { type = "object", required = ["id"], properties = { id = { type = "integer" } } }
example = { id = 1, notes = "changed from the Simulator" }

[[tools]]
name = "materials_list"
title = "List materials"
description = "The material files (screenshots, photos, notes); recipe = only those of that recipe."
read_only = true
input_schema = { type = "object", properties = { recipe = { type = "integer" }, limit = { type = "integer" } } }
example = { recipe = 1, limit = 20 }

[[tools]]
name = "build_recipe"
title = "Build a recipe"
description = "Asks the assistant to write recipe id again from its materials (the answer arrives later); extra = optional additional requirements for this time."
input_schema = { type = "object", required = ["id"], properties = { id = { type = "integer" }, extra = { type = "string" } } }
example = { id = 1, extra = "" }

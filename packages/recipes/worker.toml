type = "application"
id = "recipes"
name = "Recipes"
version = "0.4.0"
about = "Your recipe book: collect screenshots, photos and notes as materials; the assistant writes the finished recipe from them - cover photo, ingredients you can scale, the method with step pictures. Its website shows the recipes."
author = "Bot Gateway"
license = "Apache-2.0"
timeout_secs = 30

# Its own program (app_sandbox_requirements.txt): server/main.js runs in the gateway's sandbox, built on
# the app kit (kit/, copied from botgateway-packages/kit); its pages are web/.
[app]
main = "server/main.js"
icon = "🍳"
ai = "owner"
ai_sends = "a recipe with its materials (photos, screenshots, notes) when you press Build recipe"
visitors = "read the recipes and change the servings (amounts follow)"
login = "none"

# What the client's LLM may do (the program's callTool).
[[tools]]
name = "recipes_list"
title = "List recipes"
description = "The recipes (newest first), optionally only those containing a word."
read_only = true
input_schema = { type = "object", properties = { query = { type = "string" }, limit = { type = "integer" } } }

[[tools]]
name = "recipes_get"
title = "Read a recipe"
description = "One recipe with all its fields."
read_only = true
input_schema = { type = "object", required = ["id"], properties = { id = { type = "integer" } } }

[[tools]]
name = "recipes_add"
title = "Add a recipe"
description = "A new recipe: title (needed), servings, ingredients [{qty, unit, name, note}], steps [{text}], tips [text], notes, source."
input_schema = { type = "object", required = ["title"], properties = { title = { type = "string" } } }

[[tools]]
name = "recipes_update"
title = "Change a recipe"
description = "Changes the given fields of recipe id (same fields as recipes_add)."
input_schema = { type = "object", required = ["id"], properties = { id = { type = "integer" } } }

[[tools]]
name = "materials_list"
title = "List materials"
description = "The material files (screenshots, photos, notes); recipe = only those of that recipe."
read_only = true
input_schema = { type = "object", properties = { recipe = { type = "integer" }, limit = { type = "integer" } } }

[[tools]]
name = "build_recipe"
title = "Build a recipe"
description = "Asks the assistant to write recipe id again from its materials (the answer arrives later)."
input_schema = { type = "object", required = ["id"], properties = { id = { type = "integer" } } }

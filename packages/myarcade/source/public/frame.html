<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Game</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #120f18; }
      canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    </style>
  </head>
  <body>
    <canvas id="c" tabindex="0"></canvas>
    <script>
      // The game's sandboxed frame (app_myarcade_requirements.txt 6.4): no origin, no network, no storage. The page sends
      // the game once; everything after that is postMessage. Inline, because a sandboxed document cannot load this
      // address's scripts (it has no origin of its own).
      (() => {
        const canvas = document.getElementById('c')
        const send = (message) => parent.postMessage({ arcade: 1, ...message }, '*')
        let game = null
        let booted = false
        let muted = false

        // Sound on phones (iPhone): audio may only start from a tap IN this frame, and Web Audio follows the silent switch.
        // Every AudioContext the game makes is remembered and resumed on the next tap or key here; "playback" lets it
        // play with the switch on silent (iOS 17+).
        const contexts = []
        for (const name of ['AudioContext', 'webkitAudioContext']) {
          const Native = window[name]
          if (!Native) continue
          window[name] = class extends Native {
            constructor(...args) {
              super(...args)
              contexts.push(this)
            }
          }
        }
        const unlock = () => {
          try { if (navigator.audioSession) navigator.audioSession.type = 'playback' } catch {}
          for (const ctx of contexts) {
            if (ctx.state === 'closed') continue
            if (ctx.state !== 'running') ctx.resume().catch(() => {})
            try {
              const source = ctx.createBufferSource()
              source.buffer = ctx.createBuffer(1, 1, 22050)
              source.connect(ctx.destination)
              source.start(0)
            } catch {}
          }
        }
        for (const type of ['pointerup', 'touchend', 'click', 'keydown']) addEventListener(type, unlock, true)

        // While the page shows Start / Resume over the game, a tap on it lands here (the page's cover lets it through):
        // the frame does it, so the tap that starts the game also starts its sound. The game itself never sees that tap.
        let tapAction = null
        let tapping = false
        addEventListener('pointerdown', (event) => {
          if (!tapAction || !game) return
          tapping = true
          event.preventDefault()
          event.stopImmediatePropagation()
        }, true)
        addEventListener('pointerup', (event) => {
          if (!tapping) return
          tapping = false
          event.preventDefault()
          event.stopImmediatePropagation()
          const action = tapAction
          if (!action || !game) return
          tapAction = null
          unlock()
          canvas.focus()
          game[action]()
        }, true)

        addEventListener('error', (event) => send({ type: 'error', message: String(event.message) }))
        addEventListener('unhandledrejection', (event) => send({ type: 'error', message: String(event.reason) }))
        document.addEventListener('securitypolicyviolation', (event) =>
          send({ type: 'refused', message: event.violatedDirective + ' ' + event.blockedURI }),
        )

        async function boot(message) {
          const urls = {}
          for (const asset of message.assets || []) {
            urls[asset.name] = URL.createObjectURL(new Blob([asset.data], { type: asset.type }))
          }
          for (const font of message.fonts || []) {
            const face = new FontFace(font.family, font.data, font.descriptors || {})
            document.fonts.add(await face.load())
          }
          muted = Boolean(message.muted)
          const code = URL.createObjectURL(new Blob([message.code], { type: 'text/javascript' }))
          const module = await import(code)
          game = module.mount(canvas, {
            lang: message.lang,
            isMuted: () => muted,
            assetUrl: (name) => urls[name] || '',
            update: (state) => send({ type: 'state', state }),
          })
          send({ type: 'mounted' })
        }

        addEventListener('message', (event) => {
          if (event.source !== parent || !event.data) return
          const message = event.data
          if (message.type === 'boot') {
            if (booted) return
            booted = true
            boot(message).catch((error) => send({ type: 'error', message: String(error && error.message || error) }))
          } else if (message.type === 'mute') {
            muted = Boolean(message.muted)
          } else if (message.type === 'tap') {
            tapAction = message.action === 'start' || message.action === 'resume' ? message.action : null
          } else if (message.type === 'focus') {
            canvas.focus()
          } else if (message.type === 'key') {
            // Keys pressed while the page, not the frame, has the focus.
            dispatchEvent(new KeyboardEvent(message.event, { key: message.key, code: message.code, bubbles: true, cancelable: true }))
          } else if (game && ['start', 'pause', 'resume'].includes(message.type)) {
            game[message.type]()
          } else if (game && message.type === 'input') {
            game.input(message.action, Boolean(message.down))
          }
        })
        send({ type: 'ready' })
      })()
    </script>
  </body>
</html>

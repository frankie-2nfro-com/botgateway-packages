<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Game</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #120f18; }
      canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    </style>
  </head>
  <body>
    <canvas id="c" tabindex="0"></canvas>
    <script>
      // The game's sandboxed frame (app_myarcade_requirements.txt 6.4): no origin, no network, no storage. The page sends
      // the game once; everything after that is postMessage. Inline, because a sandboxed document cannot load this
      // address's scripts (it has no origin of its own).
      (() => {
        const canvas = document.getElementById('c')
        const send = (message) => parent.postMessage({ arcade: 1, ...message }, '*')
        let game = null
        let booted = false
        let muted = false

        addEventListener('error', (event) => send({ type: 'error', message: String(event.message) }))
        addEventListener('unhandledrejection', (event) => send({ type: 'error', message: String(event.reason) }))
        document.addEventListener('securitypolicyviolation', (event) =>
          send({ type: 'refused', message: event.violatedDirective + ' ' + event.blockedURI }),
        )

        async function boot(message) {
          const urls = {}
          for (const asset of message.assets || []) {
            urls[asset.name] = URL.createObjectURL(new Blob([asset.data], { type: asset.type }))
          }
          for (const font of message.fonts || []) {
            const face = new FontFace(font.family, font.data, font.descriptors || {})
            document.fonts.add(await face.load())
          }
          muted = Boolean(message.muted)
          const code = URL.createObjectURL(new Blob([message.code], { type: 'text/javascript' }))
          const module = await import(code)
          game = module.mount(canvas, {
            lang: message.lang,
            isMuted: () => muted,
            assetUrl: (name) => urls[name] || '',
            update: (state) => send({ type: 'state', state }),
          })
          send({ type: 'mounted' })
        }

        addEventListener('message', (event) => {
          if (event.source !== parent || !event.data) return
          const message = event.data
          if (message.type === 'boot') {
            if (booted) return
            booted = true
            boot(message).catch((error) => send({ type: 'error', message: String(error && error.message || error) }))
          } else if (message.type === 'mute') {
            muted = Boolean(message.muted)
          } else if (message.type === 'focus') {
            canvas.focus()
          } else if (message.type === 'key') {
            // Keys pressed while the page, not the frame, has the focus.
            dispatchEvent(new KeyboardEvent(message.event, { key: message.key, code: message.code, bubbles: true, cancelable: true }))
          } else if (game && ['start', 'pause', 'resume'].includes(message.type)) {
            game[message.type]()
          } else if (game && message.type === 'input') {
            game.input(message.action, Boolean(message.down))
          }
        })
        send({ type: 'ready' })
      })()
    </script>
  </body>
</html>

type = "application"
id = "familyhealthrecords"
name = "FamilyHealthRecords"
version = "0.1.0"
about = "Your family's health documents in one place, kept on your computer: blood tests, doctor's letters, prescriptions, blood pressure ... per family member. Your assistant reads each document and files its date and values by year; you choose which members it may talk about. A personal archive - not medical advice."
author = "Bot Gateway"
license = "Apache-2.0"
timeout_secs = 60

# Its own program (app_familyhealthrecord_requirements.txt part B): server/main.js in the gateway's sandbox; its page is
# web/. Local page only (no website); files from the phone come through the inbox folder the owner chooses.
[app]
main = "server/main.js"
icon = "🩺"
ai = "owner"
ai_sends = "each health document you add (a photo or PDF), with the member's name and birth year, to read its date, category and values"
login = "none"
inbox = true

# What the client's LLM may do: read only, and only the members the owner allows on the page.
[[tools]]
name = "health_members"
title = "Family members"
description = "The family members the owner lets the assistant read: id, name, relation, birth year, number of documents. Their records are a personal archive of what the documents say - not medical advice."
read_only = true
input_schema = { type = "object", properties = {} }
example = {}

[[tools]]
name = "health_records"
title = "Health records"
description = "A member's recorded values (newest first, at most 300): lab results with units and reference ranges and flags, blood pressure (extras systolic / diastolic / pulse), weight, glucose, medications, visits, vaccinations ... Narrow with kind (lab, blood_pressure, pulse, weight, height, glucose, temperature, medication, visit, vaccination, imaging, food, note), title (e.g. HbA1c), from / to (YYYY-MM-DD). Quote values as recorded; give no medical advice."
read_only = true
input_schema = { type = "object", required = ["member"], properties = { member = { type = "string", description = "a member's name or id from health_members" }, kind = { type = "string" }, title = { type = "string" }, from = { type = "string" }, to = { type = "string" } } }
example = { member = "Mum", kind = "blood_pressure" }

[[tools]]
name = "health_latest"
title = "Latest values"
description = "The latest value of each test / measurement of a member (optionally only a kind or a title), with its date and source document. For questions like \"what was Dad's last HbA1c?\"."
read_only = true
input_schema = { type = "object", required = ["member"], properties = { member = { type = "string" }, kind = { type = "string" }, title = { type = "string" } } }
example = { member = "Mum", kind = "lab" }

[[tools]]
name = "health_documents"
title = "Documents"
description = "A member's documents (newest 100): id, name, category, date, a short summary."
read_only = true
input_schema = { type = "object", required = ["member"], properties = { member = { type = "string" } } }
example = { member = "Mum" }

[[tools]]
name = "health_document"
title = "One document"
description = "One document of a member: its summary and every value read from it; picture = true also sends the photo itself (images only) as a file of the answer."
read_only = true
input_schema = { type = "object", required = ["member", "id"], properties = { member = { type = "string" }, id = { type = "integer" }, picture = { type = "boolean" } } }
example = { member = "Mum", id = 1 }
